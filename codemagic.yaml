workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build iOS app
        script: |
          xcodebuild -project "TYRONE XIT.xcodeproj" -scheme "TYRONE XIT" -sdk iphoneos -configuration Release -archivePath build/TYRONE.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa
          xcodebuild -exportArchive -archivePath build/TYRONE.xcarchive -exportPath build/ipa -exportOptionsPlist exportOptions.plist CODE_SIGNING_ALLOWED=NO || true
    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
