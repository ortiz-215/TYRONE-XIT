workflows:
  ios-workflow:
    name: TYRONE XIT iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: flutter pub get
      - name: Compilar IPA sin firma
        script: flutter build ipa --no-codesign --release
    artifacts:
      - build/ios/ipa/*.ipa
